name: Cache Swift packages
description: Restore and save the SwiftPM checkouts and binary artifacts that the build scripts keep in .swiftpm-cache.

inputs:
  xcode-version:
    description: Xcode version the cache was built with.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: .swiftpm-cache
        key: ${{ runner.os }}-xcode-${{ inputs.xcode-version }}-spm-${{ hashFiles('PrebidMobile.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
