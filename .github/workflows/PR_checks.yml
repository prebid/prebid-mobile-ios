name: Pull Request Checks

on:
  pull_request:
    paths:
      - 'PrebidMobile/**'
      - 'PrebidMobile.xcodeproj/**'
      - 'Frameworks/**'
      - '*.podspec'
      - 'tools/TestUtils/**'
      - 'EventHandlers/**'
      - 'scripts/**'
      - 'PrebidMobileTests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'PrebidMobile.xcworkspace/**'
      - 'Example/PrebidDemo/**'
      - 'InternalTestApp/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.xcode-version'
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

# A label change other than run-full-tests gets a group of its own, so it cannot cancel a run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ (contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && github.event.label.name != 'run-full-tests') && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Drafts run nothing, and only run-full-tests label changes rerun the checks.
  # A job skipped by `if:` reports success, so this gate must not skip the check jobs
  # themselves: their skipped runs would replace a failed result on the same commit.
  # The jobs live in a reusable workflow instead. A skipped caller reports one "Checks"
  # entry and none of the "Checks / <job>" names, which keep their last real result.
  checks:
    name: Checks
    if: ${{ !github.event.pull_request.draft && (!contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || github.event.label.name == 'run-full-tests') }}
    uses: ./.github/workflows/PR_checks_jobs.yml
